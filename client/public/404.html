<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b1a" />
    <title>Atelier — Page not found</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #ffffff 0%, #f3efff 52%, #e9fbf7 100%); color: #071022; }
      main { width: min(92vw, 560px); padding: 40px 28px; text-align: center; }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 24px; border-radius: 16px; background: #070b1a; color: #fff; font-weight: 800; }
      .eyebrow { margin: 0 0 12px; color: #6d38e8; font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(42px, 10vw, 72px); line-height: .95; letter-spacing: -.07em; }
      p { margin: 20px auto 28px; max-width: 400px; color: #5c6678; line-height: 1.6; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; border-radius: 999px; background: #070b1a; color: #fff; font-size: 14px; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #6d38e8; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <p class="eyebrow">Atelier / 404</p>
      <h1>This object wandered off.</h1>
      <p>The page you requested is no longer here. Return to the edit and keep exploring considered objects.</p>
      <a href="/">Back to Atelier</a>
    </main>
  </body>
</html>
